name: recursive-opt v2 contracts

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recursive-opt-offline:
    name: recursive-opt v2 offline (required)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RECURSIVE_OPT_LIVE: "0"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install offline contract dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest pytest-socket==0.7.0 nbclient==0.10.4 nbformat==5.10.4 ipykernel
      - name: Run spec, module, objective, knowledge, graph, and notebook contracts
        run: |
          PYTHONPATH=. pytest -q \
            --disable-socket \
            --allow-hosts=127.0.0.1,localhost \
            tests/unit_tests/test_recursive_control_plane_v2.py \
            tests/unit_tests/test_recursive_spec.py \
            tests/unit_tests/test_objectives.py \
            tests/unit_tests/test_evaluators_vector.py \
            tests/unit_tests/test_trainers_multiobjective.py

  gepa-contract:
    name: GEPA 0.1.4 contract (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RECURSIVE_OPT_LIVE: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned optional GEPA integration
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[gepa]' pytest
      - name: Verify installed version and adapter contract without paid calls
        run: |
          python -c "from importlib.metadata import version; assert version('gepa') == '0.1.4'"
          PYTHONPATH=. pytest -q tests/unit_tests/test_recursive_control_plane_v2.py -k gepa
