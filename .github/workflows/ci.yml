name: CI

on:
  push:
    branches: [ main, dev, ci-multi, CI, experimental ]
  pull_request:
    branches: [ main, dev, ci-multi, CI, experimental ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      #MODEL_ID: "internlm/internlm3-8b-instruct-awq"
      #MODEL_ID: "distilbert/distilgpt2"
      #MODEL_ID: "microsoft/Phi-4-mini-flash-reasoning"
      MODEL_ID: "internlm/internlm2_5-1_8b-chat"
      #MODEL_ID: "microsoft/Phi-4-mini-instruct"

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
  
    # 1) Restore cached HuggingFace model data (LMDeploy pulls from HF)
    - name: Restore HF cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/huggingface
        key: hf-${{ env.MODEL_ID }}

    # 2) Install LMDeploy (OpenAI-compatible API server)
    - name: Install LMDeploy and Models
      run: |
        python -m pip install --upgrade pip
        pip install "lmdeploy[serve]" openai

        pip install -U "huggingface_hub[cli]"
        #huggingface-cli download distilbert/distilgpt2
        #huggingface-cli download internlm/internlm3-8b-instruct-awq
        huggingface-cli download $MODEL_ID

    # 3) Launch LMDeploy OpenAI-compatible server (4K context)
    - name: Start LMDeploy server
      run: |
        # Start LMDeploy in background (single-line to avoid backslash issues)
        nohup lmdeploy serve api_server $MODEL_ID --server-port 23333 --session-len 4000 > lmdeploy.log 2>&1 &
        # small initial sleep so process can initialize
        sleep 5
        # Probe the server for up to ~2 minutes (60 * 2s)
        up=false
        for i in $(seq 1 60); do
          if curl -fsS http://127.0.0.1:23333/v1/models >/dev/null 2>&1; then
            up=true
            break
          fi
          sleep 2
        done
        if [ "$up" = "true" ]; then
          echo "LMDeploy server is up"
        else
          echo "LMDeploy failed to start - dumping lmdeploy.log for debugging"
          sed -n '1,200p' lmdeploy.log || true
          # also show last lines
          echo "----- lmdeploy.log tail -----"
          tail -n 200 lmdeploy.log || true
          exit 1
        fi

    # 4) (Optional) Show LMDeploy server logs on failure
    - name: Print LMDeploy logs on failure
      if: ${{ failure() }}
      run: cat lmdeploy.log

    # 5) Set up Python & install dependencies
    - uses: actions/setup-python@v5
      with: { python-version: "3.9" }
    - name: Install Python deps
      run: |
        pip install -e .
        pip install pytest datasets numpy

    # 6) Point LiteLLM/OpenAI to our local LMDeploy server
    - name: Configure LLM env
      run: |
        echo "OPENAI_API_KEY=lmdeploy" >> $GITHUB_ENV
        echo "OPENAI_API_BASE=http://127.0.0.1:23333/v1" >> $GITHUB_ENV
        echo "TRACE_LITELLM_MODEL=openai/${MODEL_ID}" >> $GITHUB_ENV

    # 7) Run all Trace unit tests
    - name: Run unit tests
      run: pytest tests/unit_tests/

    # 8) Run basic tests for each optimizer (some may be skipped/xfail for CI-sized models)
    - name: Run optimizers test suite
      run: pytest tests/llm_optimizers_tests/test_optimizer.py || true 
      continue-on-error: true
