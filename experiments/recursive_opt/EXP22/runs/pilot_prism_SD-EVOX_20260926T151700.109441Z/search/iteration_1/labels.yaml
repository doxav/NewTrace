  ### Examples
  EXAMPLES OF REFINEMENT strategies (NOT LIMITED TO, PROPOSE YOUR OWN):
  - **Computational budget**: increase local-search iterations / restart count within 10s timeout; iterate until no improving swap exists.
  - **Local polish moves**: exhaustive pairwise swaps between all GPU pairs ↔ single-model reassignment to best GPU ↔ targeted moves out of the max-KVPR GPU only.
  - **Tiebreak / ordering tuning**: vary sort keys (load density, size, load/size ratio, descending) and randomize order across restarts, keep best.
  - **Objective sharpening**: evaluate candidate moves by full max-KVPR, not average; prefer moves reducing second-highest KVPR when max is tied.
